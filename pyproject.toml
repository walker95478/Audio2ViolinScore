[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "audio2violinscore"
version = "0.1.0"
description = "Local audio to violin melody score orchestration tools."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
a2vs = "audio2violinscore.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audio2violinscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "-p", "no:cacheprovider"]

[tool.ruff]
line-length = 128
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
